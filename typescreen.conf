# typescreen configuration. Paths are relative to the working directory.
# See MANUAL.md.

# VCOM as printed on the panel's flex cable.
vcom = -2.14

# Page orientation on the panel: 0, 90, 180 or 270 degrees clockwise.
rotation = 0

# Glyph table generated with tools/glyphs.html. The number is the cell
# size in pixels; pick one that suits your panel's pixel density.
font = fonts/OldTimeyMono-24x43.bin

# Margins in cells: left/right in columns, top/bottom in rows.
margin_left = 3
margin_right = 3
margin_top = 1
margin_bottom = 1

# Space between rows, as a fraction of the cell height.
line_spacing = 1

# Rows kept at the top when the page scrolls.
keep_rows = 3

keyboard = /dev/input/event0

# Keyboard layout
layout = layouts/us.conf

# Where documents live. At start the most recently written one is opened;
# F3 lists them. ~ is your home directory.
directory = ~
