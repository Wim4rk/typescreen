# US (ANSI) layout, with US-International style dead keys on AltGr.
#
# key   plain   shift   altgr   altgr+shift
#
# A token is one character, U+XXXX, `space`, or `none`. Prefix an accent
# with `dead:` to make it combine with the next letter. Enter, Backspace
# and F1-F12 are fixed and not listed here.

